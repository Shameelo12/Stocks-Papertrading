# Test Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Tests build their schema from the entities against H2 rather than running the
# Postgres migrations, so Flyway is off here. The trade-off is that migrations are
# not exercised by the test suite; verifying them needs a real Postgres
# (Testcontainers) and is the natural next step.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Push the first alert sweep far beyond any test run. @EnableScheduling is active
# in the integration context, and a sweep firing mid-test would race against the
# assertions. PriceAlertEvaluator is covered directly by its own unit tests.
alerts.evaluation-initial-delay-ms=3600000
alerts.evaluation-interval-ms=3600000
orders.execution-initial-delay-ms=3600000
orders.execution-interval-ms=3600000

# JWT Configuration for Tests
jwt.secret=test-secret-key-min-256-bits-long-for-testing-purposes-only
jwt.expiration=3600000

# API Keys for Tests (dummy values)
finnhub.api.key=test-key
