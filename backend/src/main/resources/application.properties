# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:papertrading}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema Migrations
# Flyway owns the schema. baseline-on-migrate lets a database created by the old
# ddl-auto=update adopt V1 as its starting point without re-running it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA Configuration
# validate, never update: Hibernate checks the schema matches the entities and
# refuses to start if it does not. Under ddl-auto=update a failed change was only
# a warning, and the application would boot and then 500 on every affected query.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-in-production-use-strong-random-secret-key-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}


# Finnhub Configuration (get key from https://finnhub.io/)
finnhub.api.key=${FINNHUB_API_KEY:}
finnhub.api.url=https://finnhub.io/api/v1

# How often waiting price alerts are checked against the market, and how long
# to wait after startup before the first sweep. fixedDelay is measured from the
# end of the previous run, so sweeps can never overlap.
alerts.evaluation-interval-ms=${ALERT_INTERVAL_MS:60000}
alerts.evaluation-initial-delay-ms=${ALERT_INITIAL_DELAY_MS:10000}

# How often unfilled limit orders are checked against the market. Without this
# sweep an order only filled when its owner happened to call /orders/check-pending.
orders.execution-interval-ms=${ORDER_INTERVAL_MS:30000}
orders.execution-initial-delay-ms=${ORDER_INITIAL_DELAY_MS:15000}

# Opening cash for a newly registered account. Stored on the user at
# registration, so changing it later does not retroactively alter the
# performance figures of existing accounts.
trading.starting-balance=${STARTING_BALANCE:10000.00}

# How long a fetched share price stays usable before it is re-fetched.
# The portfolio endpoint resolves one price per holding and the UI polls it
# every few seconds, so this is what keeps upstream calls inside Finnhub's
# free-tier rate limit.
price.cache.ttl-seconds=${PRICE_CACHE_TTL_SECONDS:10}

# Application Name
spring.application.name=paper-trading-backend
