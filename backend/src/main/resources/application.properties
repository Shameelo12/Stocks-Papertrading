# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:papertrading}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-in-production-use-strong-random-secret-key-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}


# Finnhub Configuration (get key from https://finnhub.io/)
finnhub.api.key=${FINNHUB_API_KEY:}
finnhub.api.url=https://finnhub.io/api/v1

# Opening cash for a newly registered account. Stored on the user at
# registration, so changing it later does not retroactively alter the
# performance figures of existing accounts.
trading.starting-balance=${STARTING_BALANCE:10000.00}

# How long a fetched share price stays usable before it is re-fetched.
# The portfolio endpoint resolves one price per holding and the UI polls it
# every few seconds, so this is what keeps upstream calls inside Finnhub's
# free-tier rate limit.
price.cache.ttl-seconds=${PRICE_CACHE_TTL_SECONDS:10}

# Application Name
spring.application.name=paper-trading-backend
